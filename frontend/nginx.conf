server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Support client-side routing (React Router dkk)
    # Semua request yang gak match file statis diarahkan ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache asset statis biar loading lebih cepat
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Matikan akses ke file sensitif
    location ~ /\. {
        deny all;
    }
}